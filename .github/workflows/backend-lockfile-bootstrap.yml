# TEMPORARY: create the initial uv.lock on the pinned Python toolchain.
# This write-enabled workflow is removed before PR review.
name: Bootstrap backend lockfile
on:
  push:
    branches: [build/backend-python-scaffold]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.10.0"
      - run: uv python install 3.13
      - name: Generate backend uv lockfile
        run: uv lock --project apps/backend/api
      - name: Commit generated lockfile
        run: |
          git add apps/backend/api/uv.lock
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: lock Core API dependencies"
            git push origin HEAD:build/backend-python-scaffold
          fi
