# TEMPORARY: generate the first pnpm lockfile on a GitHub-hosted Node 24 runner.
# Remove this workflow from the PR after the lockfile has been committed.
name: Bootstrap frontend lockfile
on:
  push:
    branches: [docs/frontend-pnpm-scaffold]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        run: |
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: lock frontend workspace dependencies"
            git push origin HEAD:docs/frontend-pnpm-scaffold
          fi
